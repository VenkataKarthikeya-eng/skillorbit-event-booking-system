<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Background Container -->
  <rect width="32" height="32" rx="8" fill="#0f172a" />
  
  <!-- Subtle Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#1e293b" />
  
  <!-- Calendar / Ticket Header Bar -->
  <rect x="6" y="8" width="20" height="4" rx="1.5" fill="#2563eb" />
  
  <!-- Calendar Body -->
  <rect x="6" y="14" width="20" height="11" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1" />
  
  <!-- Date Grid Dots (Active booking indicator) -->
  <circle cx="10" cy="18" r="1.25" fill="#94a3b8" />
  <circle cx="16" cy="18" r="1.25" fill="#94a3b8" />
  <circle cx="22" cy="18" r="1.25" fill="#38bdf8" />
  <circle cx="10" cy="22" r="1.25" fill="#94a3b8" />
  <circle cx="16" cy="22" r="1.25" fill="#10b981" />
  <circle cx="22" cy="22" r="1.25" fill="#94a3b8" />
  
  <!-- Top Calendar Rings -->
  <rect x="10" y="6" width="2" height="3.5" rx="1" fill="#cbd5e1" />
  <rect x="20" y="6" width="2" height="3.5" rx="1" fill="#cbd5e1" />
</svg>